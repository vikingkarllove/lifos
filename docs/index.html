<style>
:root{--bg:#07090C;--panel:#0C1015;--line:#232A33;--line2:#161B22;--text:#E7EAEE;--muted:#9AA4B1;--dim:#5A6470;--gold:#E8C26A;--cream:#F1E6C8;
--jord:#C2A86E;--vatten:#8FB3C9;--eld:#D8834A;--luft:#D9C98A;--eter:#B9A3D9;--serif:'Cormorant Garamond',Georgia,serif;--label:Jost,'Avenir Next',sans-serif}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,system-ui,sans-serif;font-size:15px;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer}
#app{max-width:480px;margin:0 auto;padding:max(20px,env(safe-area-inset-top)) 18px 110px}
.lbl{font-family:var(--label);font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:var(--muted);margin:0 0 8px}
.p{position:relative;border:1px solid var(--line);background:var(--panel);border-radius:4px;padding:14px;margin-bottom:12px}
.p:before,.p:after{content:"";position:absolute;width:10px;height:10px;border-style:solid;border-color:var(--gold)}
.p:before{top:-1px;left:-1px;border-width:1px 0 0 1px}.p:after{bottom:-1px;right:-1px;border-width:0 1px 1px 0}
h1{font-family:var(--serif);font-weight:600;font-size:34px;color:var(--cream);margin:0;line-height:1.1}
.serif{font-family:var(--serif)}
.rune{font-family:'Noto Sans Runic','Segoe UI Historic','Apple Symbols',serif;line-height:1}
.muted{color:var(--muted)}.small{font-size:13px}
.head{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:14px}
.iconbtn{width:48px;height:48px;display:flex;align-items:center;justify-content:center;background:none;border:none;color:var(--eter)}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px}
.bar{height:4px;background:#1E242C;border-radius:2px;flex:1}.bar>i{display:block;height:4px;border-radius:2px}
.tabs{display:flex;gap:8px;margin-bottom:8px}
.tab{flex:1;min-height:52px;border-radius:4px;border:1px solid #2A3340;background:transparent;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px}
.tab b{font-family:var(--label);font-weight:400;font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
.tab span{font-size:11.5px;color:var(--muted)}
.tab.on{border-color:var(--gold);background:rgba(232,194,106,.10)}.tab.on b{color:var(--gold)}
.item{width:100%;min-height:48px;background:none;border:none;border-bottom:1px solid var(--line2);display:flex;justify-content:space-between;align-items:center;text-align:left;padding:0}
.item:last-of-type{border-bottom:none}
.ck{width:24px;height:24px;flex-shrink:0;border-radius:50%;border:1px solid #3A4450;display:flex;align-items:center;justify-content:center;font-size:13px;color:var(--bg)}
.item.done .ck{background:var(--gold);border-color:var(--gold)}.item.done .nm{color:#6B7684}
.tag{font-size:11.5px;margin-left:6px}
.add{width:100%;min-height:46px;margin-top:10px;background:transparent;border:1px dashed var(--gold);border-radius:4px;color:var(--gold);font-family:var(--label);letter-spacing:.06em}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.chip{min-height:38px;border:1px solid #3A4450;border-radius:20px;padding:0 14px;background:transparent}
.wk{display:grid;grid-template-columns:repeat(7,1fr);text-align:center;font-family:var(--label);font-size:11px;color:var(--muted)}
.wk div{padding:6px 0;border-radius:4px}.wk .on{border:1px solid var(--gold);color:var(--gold)}
.dots{display:flex;justify-content:center;gap:3px;margin-top:5px;min-height:7px}.dots i{width:7px;height:7px;border-radius:50%}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{min-height:92px;border:1px solid var(--line);background:var(--panel);border-radius:4px;padding:12px;text-align:left;display:flex;flex-direction:column;justify-content:flex-end;gap:3px}
.tile .t{font-family:var(--serif);font-size:19px;color:var(--cream)}.tile .d{font-size:12px;color:var(--muted)}
.tile.soon{opacity:.55}
nav.bottom{position:fixed;left:0;right:0;bottom:0;background:var(--bg);border-top:1px solid #1E242C;padding:8px 8px max(10px,env(safe-area-inset-bottom));display:flex;justify-content:space-around;align-items:center;z-index:5}
nav.bottom button{min-width:58px;min-height:50px;background:none;border:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;color:#7C8794;font-family:var(--label);font-size:10px;letter-spacing:.14em;text-transform:uppercase}
nav.bottom .hearth{width:56px;height:56px;border-radius:50%;border:1px solid var(--gold);color:var(--gold);font-size:22px;letter-spacing:0}
nav.bottom .on{color:var(--gold)}
input,select,textarea{font:inherit;background:var(--bg);color:var(--text);border:1px solid #2A3340;border-radius:4px;padding:10px;width:100%}
.btn{min-height:44px;border:1px solid #3A4450;border-radius:4px;background:transparent;padding:0 14px}
.btn.gold{border-color:var(--gold);color:var(--gold)}
.stat{background:#0F141A;border-radius:4px;padding:10px;text-align:center}
.stat b{display:block;font-family:var(--serif);font-weight:500;font-size:22px;color:var(--gold)}
.stat span{font-size:12px;color:var(--muted)}
.toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:#12161C;border:1px solid var(--gold);color:var(--gold);padding:10px 16px;border-radius:20px;font-size:13px;opacity:0;transition:opacity .3s;pointer-events:none;z-index:9;white-space:nowrap}
.toast.show{opacity:1}
.entry{padding:8px 0;border-bottom:1px solid var(--line2);display:flex;justify-content:space-between;align-items:center;gap:8px}
.zoomin{animation:zi .55s cubic-bezier(.2,.7,.2,1);transform-origin:50% 50%}@keyframes zi{from{transform:scale(.22);opacity:0}to{transform:scale(1);opacity:1}}
@media (prefers-reduced-motion:reduce){.zoomin{animation:none}}
.solidglow{filter:drop-shadow(0 0 6px currentColor);color:inherit}
.eterport{position:relative;display:flex;flex-direction:column;align-items:center;gap:3px;background:none;border:none;padding:6px 4px;min-width:72px;cursor:pointer}
.eterring{position:absolute;top:2px;left:50%;width:58px;height:58px;margin-left:-29px;border-radius:50%;border:1px solid var(--eter);opacity:.35;animation:eterpuls 6s ease-in-out infinite}
@keyframes eterpuls{0%,100%{transform:scale(.92);opacity:.2}50%{transform:scale(1.04);opacity:.5}}
@media (prefers-reduced-motion:reduce){.eterring{animation:none}}
.kodexblad{background:linear-gradient(#11141A,#0E1116);border-color:#4A4130;padding:18px 18px 14px}.kodexblad p{margin:0 0 10px;line-height:1.6}
.foldh{display:flex;align-items:center;gap:10px;width:100%;background:none;border:none;padding:0;min-height:40px;color:inherit;text-align:left;cursor:pointer}.foldh .lbl{flex:1;margin:0}
.mini{display:inline-flex;gap:3px;flex-wrap:wrap;justify-content:center}.mini i{width:7px;height:7px;border:1px solid #4A5260;border-radius:1.5px;display:block}.mini i.on{background:var(--gold);border-color:var(--gold)}
.chev{color:var(--muted);font-size:12px;width:12px;text-align:center}
.topbar{display:flex;justify-content:space-around;align-items:center;margin:-6px -6px 14px;padding:4px 0 10px;border-bottom:1px solid var(--line2);position:relative}.topbar:after{content:"";position:absolute;left:20%;right:20%;bottom:-1px;height:1px;background:linear-gradient(90deg,transparent,rgba(232,194,106,.55),transparent)}.topbar>button{flex:1;max-width:110px}
.topsep{width:1px;align-self:stretch;margin:8px 2px;background:linear-gradient(transparent,rgba(232,194,106,.35),transparent)}
</style>
</head>

<script>
// ---------- Läkeboken: övningarna och deras dagg per element ----------
const EL = {jord:{n:'Jord',page:'Föda, verk och arv'},luft:{n:'Luft',page:'Andning, ord och rytm'},eld:{n:'Eld',page:'Kropp, träning och färdighet'},vatten:{n:'Vatten',page:'Känslor, band och vishet'},eter:{n:'Eter',page:'Stillhet, sejd och dröm'}};
const ELORDER = ['jord','vatten','eld','luft','eter'];
const ACTS = {
 aktivering:{n:'Aktiveringssekvensen',e:{jord:6,vatten:4,eld:2}},
 andning:{n:'Andning',e:{luft:10}}, toning:{n:'Toning',e:{eter:6,luft:4}}, meditation:{n:'Meditation',e:{eter:10}},
 stretch:{n:'Stretch, 5 min',e:{vatten:6}}, ljus:{n:'Morgonljus',e:{eld:5}}, kallbad:{n:'Kallbad',e:{vatten:6,eld:6}},
 runa:{n:'Dagens runa',e:{eter:4}}, styrka:{n:'Styrkepass',e:{eld:15,jord:5}}, sprint:{n:'Sprint',e:{eld:12}},
 balans:{n:'Balans, 5 min',e:{jord:4,luft:4}}, lasning:{n:'Läsning',e:{luft:10}}, promenad:{n:'Lång promenad',e:{jord:10}},
 bastu:{n:'Bastu',e:{eld:8,vatten:6}}, kvallsfraga:{n:'Kvällsfrågan',e:{vatten:8}}, dromavsikt:{n:'Drömavsikt',e:{eter:6}},
 langstretch:{n:'Lång stretch',e:{vatten:8}}, skarmfritt:{n:'Skärmfritt före sömnen',e:{eter:4,vatten:2}},
 fasta:{n:'Veckans fasta, 24 h',e:{eter:10,eld:10}}, skriva:{n:'Skriva',e:{luft:8}}, rita:{n:'Rita',e:{jord:8}},
 vandring:{n:'Vandring',e:{jord:12}}, bad:{n:'Bad i sjö eller hav',e:{vatten:10}}, sejd:{n:'Sejd',e:{eter:8}},
 dromdagbok:{n:'Drömdagbok',e:{eter:6}}, relation:{n:'Tid med en nära',e:{vatten:10}}, kost:{n:'Kost enligt dagen',e:{jord:6}},
 jordning:{n:'Jordning, barfota',e:{jord:6}}, sol:{n:'Soljus',e:{eld:5}}
};
const EXTRA = ['bastu','kallbad','promenad','vandring','styrka','meditation','lasning','skriva','rita','bad','relation','sejd','jordning','sol'];

// ---------- Veckans sju arketyper och protokoll ----------
const ARK = [
 {d:'söndag',pl:'Solen',gud:'Balder',ark:'Ljusbäraren',k:'glans, glädje och helhet',slag:'varm',kost:'bondkost',q:'Vad lyste jag upp i dag?'},
 {d:'måndag',pl:'Månen',gud:'Måne',ark:'Drömmaren',k:'mottaglighet, känsla och minne',slag:'kall',kost:'jägarkost',q:'Vad kände jag utan att säga det?'},
 {d:'tisdag',pl:'Mars',gud:'Tyr',ark:'Den edsvurne',k:'mod, rättvisa och ordet som hålls',slag:'varm',kost:'bondkost',q:'Vilket löfte höll jag?'},
 {d:'onsdag',pl:'Merkurius',gud:'Oden',ark:'Vandraren',k:'visdom, ord och offer för kunskap',slag:'eter',kost:'fasta',q:'Vad gav jag upp, och vad fick jag veta?'},
 {d:'torsdag',pl:'Jupiter',gud:'Tor',ark:'Beskyddaren',k:'kraft, trygghet och folket',slag:'varm',kost:'bondkost',q:'Vem stod jag upp för?'},
 {d:'fredag',pl:'Venus',gud:'Freja',ark:'Älskarinnan',k:'kärlek, skönhet och sejd',slag:'kall',kost:'jägarkost',q:'Vad var vackert i dag?'},
 {d:'lördag',pl:'Saturnus',gud:'Loke',ark:'Gränsvandraren',k:'rening, avslut och förvandling',slag:'kall',kost:'jägarkost',q:'Vad lämnar jag bakom mig?'}];
const RUNES=[['ᛋ','Sowilo','solens runa'],['ᛗ','Mannaz','människans och sinnets runa'],['ᛏ','Tiwaz','Tyrs runa'],['ᚨ','Ansuz','Odens runa'],['ᚦ','Thurisaz','Tors runa'],['ᚠ','Fehu','vanernas rikedom'],['ᛚ','Laguz','vattnets runa, badets dag']];
const VERK=['Möt solen ute, och gör något som lyser upp någon annans dag.',
 'Skriv drömmen i dagboken på morgonen, ta kallbadet, och sätt en drömavsikt på kvällen.',
 'Svär en liten ed på morgonen och håll den. Gör det svåraste först.',
 'Den heliga dagen: Odens offer. Fastan, stillheten och studier i runorna; bara roten och det heliga.',
 'Lyft tungt, och bär en börda åt någon annan.',
 'Skapa något vackert eller ge en gåva till någon nära. Bastu och sejd.',
 'Fixardagen: rena hemmet och kroppen, laga det som är trasigt, bastu och kallbad, och bryt en vana.'];
const RINFO=[
 {m:'Solen, segern och klarheten: ljuset som leder och livskraften som strålar ut.',k:'Sól er landa ljómi',ks:'Solen är ländernas ljus (isländska runkvädet)',g:'Ssss-ooo-wi-looo, eller ett långt ssss som en strålande ton',r:'Rita runan i luften mot solen, eller i daggen på en ruta.'},
 {m:'Människan, sinnet och minnet: jaget i spegeln och banden till andra.',k:'Maðr er manns gaman',ks:'Människan är människans glädje (isländska runkvädet)',g:'Mmmm-aaa-nnnaz, ett varmt surr i bröstet',r:'Rita runan på handflatan och lägg den mot hjärtat.'},
 {m:'Tyr och rättvisan: modet, offret och ordet som hålls.',k:'Týr er einhendr áss',ks:'Tyr är den enhänte asen (isländska runkvädet)',g:'Tiiii-waaaz, eller ett klart, rakt tiiiir',r:'Rita runan som en pil uppåt innan du gör det svåraste.'},
 {m:'Oden, ordet och inspirationen: anden som talar och visdomen som vinns genom offer.',k:'Óss er aldingautr ok ásgarðs jöfurr ok valhallar vísi',ks:'Oden är den urgamle skaparen, Asgårds furste och Valhalls hövding (isländska runkvädet)',g:'Aaaa-nnn-suuuz, ett öppet aaaa från hela kroppen',r:'Rista runan i trä eller rita den, och sitt i tystnad med den.'},
 {m:'Tursen och Tors kraft: urkraften som både hotar och skyddar, hammaren som håller kaos borta.',k:'Þurs er kvenna kvöl',ks:'Tursen är kvinnornas plåga (isländska runkvädet); den vilda kraften som måste tämjas',g:'Thuuu-ri-saaz, ett tungt, mullrande thhhh',r:'Rita runan innan du lyfter tungt, som en hammare som slår.'},
 {m:'Rikedomen och det som flödar: boskap, guld och vanernas gåvor, det som växer när det delas.',k:'Fé er frænda róg',ks:'Rikedom är tvedräkt mellan fränder (isländska runkvädet); därför ska den ges vidare',g:'Ffff-eee-huuu, en mjuk, flödande ton',r:'Rita runan på en gåva du ger bort.'},
 {m:'Vattnet, flödet och reningen: sjön, källan och det undermedvetnas djup.',k:'Lögr er vellanda vatn',ks:'Vattnet är det strömmande vattnet (isländska runkvädet)',g:'Llll-aaa-guuuz, en böljande ton som vatten',r:'Rita runan i vattnet innan du badar, eller på den immiga spegeln i bastun.'}];
Object.assign(ACTS,{sol_mote:{n:'Möt solen ute',e:{eld:6}},ljusgava:{n:'Lys upp någons dag',e:{vatten:8}},lyssna:{n:'Tio minuter utan intryck',e:{vatten:6}},
 ed:{n:'Svär dagens ed',e:{eld:6}},svarast:{n:'Gör det svåraste först',e:{eld:8}},runstudie:{n:'Studera dagens runa',e:{eter:8}},kodex:{n:'Läs i kodexen',e:{luft:8}},
 stillhet:{n:'Stillhet eller utesittning',e:{eter:8}},borda:{n:'Bär en börda åt någon',e:{vatten:8,jord:4}},vackert:{n:'Skapa något vackert',e:{luft:4,jord:4}},
 gava:{n:'Ge en gåva till någon nära',e:{vatten:8}},rena:{n:'Rena hemmet',e:{jord:8}},laga:{n:'Laga något trasigt',e:{jord:8}},vana:{n:'Bryt en vana',e:{vatten:6,eter:4}}});
const ARKPLAN={0:{morgon:['sol_mote'],dag:['ljusgava','relation'],kvall:[]},1:{morgon:['dromdagbok'],dag:['lyssna'],kvall:[]},2:{morgon:['ed'],dag:['svarast'],kvall:[]},
 3:{morgon:['runstudie'],dag:['kodex','skriva'],kvall:['stillhet']},4:{morgon:[],dag:['borda'],kvall:[]},5:{morgon:[],dag:['vackert','gava'],kvall:['sejd']},6:{morgon:[],dag:['rena','laga','vana'],kvall:[]}};
const isArk=(wd,a)=>Object.values(ARKPLAN[wd]).some(l=>l.includes(a));
function lists(wd){
 if(S.prog&&S.prog.plan){const r={morgon:[],dag:[],kvall:[]};S.prog.plan.forEach(p=>{if(p.days.includes(wd)&&ACTS[p.a]&&r[p.del])r[p.del].push(p.a)});return r}
 return listsDefault(wd)}
function listsDefault(wd){
 const m=['andning','toning','meditation','stretch','ljus']; if([1,3,6].includes(wd)) m.push('kallbad'); m.push('runa');
 const d=[]; if([0,2,4].includes(wd)) d.push('styrka'); if([2,4].includes(wd)) d.push('sprint');
 if(![0,3].includes(wd)) d.push('balans'); d.push('lasning'); if([1,5,6].includes(wd)) d.push('promenad');
 d.push(wd===3?'fasta':'kost');
 const k=[]; if([5,6].includes(wd)) k.push('bastu'); k.push('kvallsfraga'); if(wd===1) k.push('dromavsikt'); if(wd===6) k.push('langstretch'); k.push('skarmfritt');
 const P=ARKPLAN[wd]; return {morgon:[...P.morgon,...m],dag:[...P.dag,...d],kvall:[...k.slice(0,0),...P.kvall,...k]};
}
const DOTS = wd => { const r=[]; if([0,2,4].includes(wd)) r.push('var(--eld)'); if([2,4].includes(wd)) r.push('var(--eld)'); if(wd===3) r.push('ring'); if([1,3,6].includes(wd)) r.push('var(--vatten)'); if([5,6].includes(wd)) r.push('#C0503C'); return r; };

// ---------- Kalendern: 13 månader à 28 dagar från Mödranatt ----------
const MON = ['Is','Torre','Skare','Ostara','Sav','Blomst','Sol','Dagg','Gull','Haust','Dis','Blot','Jul'];
const SOLST = {2023:'2023-12-22',2024:'2024-12-21',2025:'2025-12-21',2026:'2026-12-21',2027:'2027-12-22',2028:'2028-12-21',2029:'2029-12-21',2030:'2030-12-21',2031:'2031-12-22'};
const PHASE = ['nymåne','tilltagande','fullmåne','avtagande'];
function iso(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function dparse(s){const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)}
function solFor(y){return dparse(SOLST[y]||(y+'-12-21'))}
function cal(date){
 const d=new Date(date.getFullYear(),date.getMonth(),date.getDate());
 let base=solFor(d.getFullYear()); if(d<base) base=solFor(d.getFullYear()-1);
 const diff=Math.round((d-base)/864e5);
 if(diff===0) return {txt:'Mödranatt',sub:'dagen bortom tiden',week:0,idx:0,mo:-1,day:0,base};
 const i=diff-1; if(i>=364) return {txt:'Dagen bortom tiden',sub:'utanför månaderna',week:0,idx:diff,mo:-1,day:0,base};
 const mo=Math.floor(i/28), day=i%28+1, w=Math.floor((day-1)/7);
 return {txt:MON[mo]+' '+day,sub:'vecka '+(w+1)+' · '+PHASE[w],week:w+1,idx:diff,mo,day,base};
}

// ---------- Lagring ----------
const KEY='livets-rollspel-v1';
let S={log:[],custom:{}};
try{const raw=localStorage.getItem(KEY); if(raw) S=Object.assign(S,JSON.parse(raw));}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}}
Object.assign(ACTS,S.custom);
if(!S.mode){S.mode=S.log&&S.log.length?'allt':'lagom';try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
const MODE=()=>S.mode||'lagom';

// ---------- Beräkningar ----------
const today=()=>iso(new Date());
function done(act,day){return S.log.some(l=>l.a===act&&l.d===day)}
function toggle(act,day,extra){
 const i=S.log.findIndex(l=>l.a===act&&l.d===day&&!!l.x===!!extra);
 if(i>=0&&!extra){S.log.splice(i,1);save();return false}
 S.log.push({a:act,d:day,t:Date.now(),x:!!extra});save();return true;
}
function daggOf(entries){const t={jord:0,luft:0,eld:0,vatten:0,eter:0};entries.forEach(l=>{const a=ACTS[l.a];if(a)for(const k in a.e)t[k]+=a.e[k]});return t}
function level(d){return 1+Math.floor((Math.sqrt(1+8*d/60)-1)/2)}
function levelFloor(n){return 60*(n-1)*n/2}
const CLASS={eld:['Kämpen',['Sköldbärare','Drengr','Huskarl','Kämpe','Bärsärk']],luft:['Skalden',['Lyssnare','Sagoman','Skald','Lagman','Tul']],
 vatten:['Helaren',['Vattenbärare','Läkare','Signare','Klok','Brunnsväktare']],jord:['Bonden',['Torpare','Bonde','Odalbonde','Storbonde','Hövding']],
 eter:['Runmästaren',['Lärjunge','Runristare','Erilaz','Vitke','Siare']]};

function solDag(d,lat,lon){
 const rad=Math.PI/180, n0=new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate(),12)), J=n0/864e5+2440587.5, n=J-2451545;
 const L=(280.46+0.9856474*n)%360, g=(357.528+0.9856003*n)*rad, lam=(L+1.915*Math.sin(g)+0.02*Math.sin(2*g))*rad, eps=23.439*rad;
 const dec=Math.asin(Math.sin(eps)*Math.sin(lam)), ra=Math.atan2(Math.cos(eps)*Math.sin(lam),Math.cos(lam))/rad;
 let eot=(L-((ra+360)%360)); eot=((eot+540)%360-180)*4; // minuter
 const tz=-n0.getTimezoneOffset()/60, noon=12-lon/15-eot/60+tz; // lokal klocktid
 const c=(Math.sin(-0.833*rad)-Math.sin(lat*rad)*Math.sin(dec))/(Math.cos(lat*rad)*Math.cos(dec));
 if(c>1)return {noon,rise:null,set:null,polar:'natt'}; if(c<-1)return {noon,rise:null,set:null,polar:'dag'};
 const H=Math.acos(c)/rad/15; return {noon,rise:noon-H,set:noon+H};
}

function planTimmar(now){
 const {lat,lon}=loc(), d0=new Date(now.getFullYear(),now.getMonth(),now.getDate()), dm=new Date(d0-864e5), dp=new Date(+d0+864e5);
 const s=solDag(d0,lat,lon), sm=solDag(dm,lat,lon), sp=solDag(dp,lat,lon);
 if(s.rise==null||sm.set==null||sp.rise==null)return null;
 const t=now.getHours()+now.getMinutes()/60, out=[];
 const block=(wd,rise,set,nextRise)=>{const dl=(set-rise)/12,nl=(nextRise+24-set)/12,st=DAGPLAN[wd];
  for(let k=0;k<24;k++){const a=k<12?rise+k*dl:set+(k-12)*nl,b=k<12?rise+(k+1)*dl:set+(k-11)*nl;out.push({a,b,p:PLAN[(st+k)%7],natt:k>=12})}};
 if(t<s.rise){block((now.getDay()+6)%7,sm.rise-24,sm.set-24,s.rise)}else block(now.getDay(),s.rise,s.set,sp.rise);
 return {timmar:out,sol:s};
}

'Om stjärnbildsdagarna':'About the constellation days','Efter Maria Thuns biodynamiska kalender, som bygger på Rudolf Steiners lantbrukskurs 1924: månen passerar en stjärnbild på två till fyra dagar, och varje stjärnbild hör till ett av de fyra elementen. Stjärnbildernas gränser är avstämda mot en publicerad biodynamisk kalender. Faser, skiften och noder räknas ut astronomiskt och kan avvika upp till någon timme; dagen visas som den är vid middagstid.':'Following Maria Thun\'s biodynamic calendar, based on Rudolf Steiner\'s agriculture course of 1924: the moon passes a constellation in two to four days, and each constellation belongs to one of the four elements. The constellation boundaries are checked against a published biodynamic calendar. Phases, changes and nodes are calculated astronomically and may differ by up to an hour; the day is shown as it is at noon.',

'Om klockorna':'About the clocks','Planettimmarna kommer ur babylonisk och hellenistisk astrologi. Varje timme styrs av en av de sju planeterna i kaldeisk ordning, och dagens planet styr dess första timme; därför heter veckodagarna som de gör. Runorna i ringen är dagarnas runor. Eyktirna är de fornnordiska dagsmärkena ur Grágás och Snorre, lästa efter solens läge över landskapet. Organklockan kommer ur kinesisk läkekonst och doshornas klocka ur ayurveda. Dessa fyra är traditionell kunskap och astrologi, inte medicin. Kroppens dygnsrytm bygger på kronobiologisk forskning; tiderna är medelvärden och skiftar med kronotyp och årstid.':'The planetary hours come from Babylonian and Hellenistic astrology. Each hour is ruled by one of the seven planets in Chaldean order, and the day\'s planet rules its first hour; that is why the weekdays are named as they are. The runes in the ring are the runes of the days. The eyktir are the Old Norse day-marks from Grágás and Snorri, read by the sun\'s position over the landscape. The organ clock comes from Chinese medicine and the clock of the doshas from ayurveda. These four are traditional knowledge and astrology, not medicine. The body\'s circadian rhythm is based on chronobiological research; the times are averages and shift with chronotype and season.',

'Här börjar asatrologin i den västerländska astrologin: den tropiska zodiaken, där Väduren börjar vid vårdagjämningen, och hela tecken som hus. De sju klassiska planeterna är också veckans gudar: Solen och Balder, Månen och Måne, Merkurius och Oden, Venus och Freja, Mars och Tyr, Jupiter och Tor, Saturnus och Loke. Det nordiska lagret, med stjärnbilder som Friggs rock och Tjatses ögon, läggs till här. Positionerna räknas med förenklade banelement och stämmer på några bågminuter när. Astrologi är tradition och tolkningskonst, inte vetenskap.':'Here asatrology begins in Western astrology: the tropical zodiac, where Aries begins at the spring equinox, and whole signs as houses. The seven classical planets are also the gods of the week: the Sun and Baldr, the Moon and Máni, Mercury and Odin, Venus and Freyja, Mars and Tyr, Jupiter and Thor, Saturn and Loki. The Norse layer, with constellations such as Frigg\'s distaff and Þjazi\'s eyes, will be added here. Positions are calculated with simplified orbital elements and are accurate to a few arcminutes. Astrology is tradition and the art of interpretation, not science.',

function trs(t){if(!t)return t;if(EN[t]!==undefined)return EN[t];for(const [re,to] of EN_RE)if(re.test(t))return t.replace(re,to);
 if(t.includes(' · ')){const p=t.split(' · ');const r=p.map(x=>trs(x.trim()));if(r.some((x,i)=>x!==p[i].trim()))return r.join(' · ')}
 if(/^‹ /.test(t)){const r=trs(t.slice(2));if(r!==t.slice(2))return '‹ '+r}
 if(/^[−+⊙] /.test(t)){const r=trs(t.slice(2));if(r!==t.slice(2))return t.slice(0,2)+r}
 if(/[.:]$/.test(t)&&t.length>2){const c=t.slice(0,-1),r=trs(c);if(r!==c)return r+t.slice(-1)}
 if(/^[A-ZÅÄÖ]/.test(t)){const lo=t[0].toLowerCase()+t.slice(1);if(EN[lo]!==undefined){const r=EN[lo];return r[0].toUpperCase()+r.slice(1)}}
 if(/^[a-zåäö]/.test(t)){const up=t[0].toUpperCase()+t.slice(1);if(EN[up]!==undefined){const r=EN[up];return r[0].toLowerCase()+r.slice(1)}}
 if(/ ·$/.test(t)){const c=t.slice(0,-2),r=trs(c);if(r!==c)return r+' ·'}
 if(/^· /.test(t)){const r=trs(t.slice(2));if(r!==t.slice(2))return '· '+r}
 if(/^✓ /.test(t)){const r=trs(t.slice(2));if(r!==t.slice(2))return '✓ '+r}
 const m=t.match(/^(.*?)(\s*[›‹]\s*)$/);if(m&&m[1]&&trs(m[1])!==m[1])return trs(m[1])+m[2];
 if(t.includes(' → ')){const p=t.split(' → '),r=p.map(x=>trs(x));if(r.some((x,i)=>x!==p[i]))return r.join(' → ')}
 const pre=t.match(/^([\u3400-\u9fff\u0590-\u05ff]+|[\u2648-\u2653]\uFE0E?) (.+)$/);if(pre){const r=trs(pre[2]);if(r!==pre[2])return pre[1]+' '+r}
 if(t.includes(', ')){const p=t.split(', '),r=p.map(x=>trs(x));if(r.some((x,i)=>x!==p[i]))return r.join(', ')}
 return t}

 mon:['LifOS egna tretton månader på 28 dagar, efter månens rytm, med en dag bortom tiden vid solhvarvet. Varje månad har en naturbild och en förmåga att förädla.','Låt månadens förmåga vara det du övar under de fyra veckorna.'],

 sami:['Samerna delar året i åtta årstider efter renskötselns år: vinter, vårvinter, vår, vårsommar, sommar, höstsommar, höst och höstvinter. Gränserna skiftar mellan siidorna.','I renskötseln avgör årstiden arbetet: vårvinterns flytt mot kalvningslandet, kalvningen, sommarens kalvmärkning, höstens slakt och brunst, och höstvinterns skiljning och flytt till vinterbetet.'],
 kelt:['De irländska eldfesterna delar året: Samhain den 1 november inleder den mörka halvan och Beltane den 1 maj den ljusa. Däremellan ligger Imbolc den 1 februari och Lughnasadh den 1 augusti.','Vid Beltane tändes eldar, och boskapen drevs mellan två eldar till skydd. Vid Samhain hedrades de döda och man spådde om året. Vid Imbolc flätades Brigids kors, och vid Lughnasadh firades den första skörden med samlingar och lekar.'],
 forn:['Den isländska kalendern har tolv månader på 30 dagar och fyra extranätter, delade i två halvår: vetr från första vinterdagen i oktober och sumar från första sommardagen i april. Varje månad börjar på en bestämd veckodag.','Halvårsskiftena var fester. Vid vinternätterna hölls blot, i Þorri hålls Þorrablót, månadens första dag är husbondens dag och Góas första dag är husfruns dag, och första sommardagen firas än i dag med gåvor.'],
 wx:['Kinesisk medicin knyter årets tider till de fem faserna och deras organ: våren till trä och levern, sommaren till eld och hjärtat, sensommaren till jord och mjälten, hösten till metall och lungorna och vintern till vatten och njurarna.','Huangdi Neijing, kapitel 2, ger rådet: på våren lägg dig sent, stig upp tidigt och gå med långa steg. På sommaren lägg dig sent, stig upp tidigt och tröttna inte på solen. På hösten lägg dig tidigt och stig upp med tuppen. På vintern lägg dig tidigt, stig upp sent, vänta på solen och sök värmen.'],
 ritu:['Ayurveda delar året i sex årstider, ritu, på två månader var. Solens norrgång, från senvintern till sommarhettan, tar kraft ur kroppen, och sydgången, från regntiden till förvintern, ger den tillbaka. Doshorna samlas och blossar upp i en fast ordning.','Ritucharya, årstidernas levnadsregler: i förvintern och senvintern närande och varm mat, oljemassage och träning, när matsmältningens eld är stark. På våren lätt mat mot kapha, på sommaren svalt, sött och mycket vätska, under regntiden lättsmält och varm mat mot vata, och på hösten svalkande och bittert mot pitta.'],
 ich:['Kinesisk kalenderlära knyter tolv av I Chings hexagram till årets månader. Vid vintersolståndet föds det första yang-strecket, i hexagrammet Återkomsten, och sedan växer ljuset streck för streck till sex yang vid sommaren, då mörkret börjar växa på samma sätt.','Läs hexagrammets bild som månadens hållning. Om Återkomsten säger I Ching att forntidens kungar stängde passen vid solståndet: köpmän och främlingar reste inte, och härskaren besökte inte landskapen. Vid vändningen vilar man.'],
 sp:['De 24 solperioderna är det kinesiska bondeårets almanacka, var och en ungefär femton dagar, och följer solens bana i steg om femton grader. De skrevs in på Unescos lista över immateriellt kulturarv 2016.','Perioderna styrde sådd, skörd och kost. Vid Qingming sköts gravarna, och vid vintersolståndet äter man dumplings eller risbollar för värmens skull.'],
 mhj:['Medicinhjulet är en lära hos många ursprungsfolk i Nordamerika. Här följer vi en anishinaabe-lära: öster är gult, våren och födelsen, söder är rött, sommaren och ungdomen, väster är svart, hösten och vuxenlivet, och norr är vitt, vintern och de äldre.','Hjulet används för att hålla balansen mellan kropp, känsla, tanke och ande, och de fyra heliga växterna brukas: tobak som offer och bön, ceder, salvia och sötgräs till rening. Ceremonierna hör till folken själva och lärs av deras äldre.'],
 gah:['Zarathustrismen firar sex gahambar, fester på fem dagar vardera, en för varje del av skapelsen i ordning: himlen, vattnet, jorden, växterna, djuren och människan. Datumen följer den årstidsbundna fasli-kalendern.','Gahambar firas tillsammans: man ber, bjuder och delar mat med alla, oavsett rang, som tack för den del av skapelsen som festen hedrar.'],
 azt:['Aztekernas solår, xiuhpohualli, hade 18 perioder på 20 dagar och fem tomma dagar. Varje period slutade med en fest för en gud eller kraft, som regnets Tlaloc i Atlcahualo och solens Huitzilopochtli i Panquetzaliztli. Datumen följer Sahagún, och forskarna är oense om dem.','Festkalendern är historisk, och dess riter firas inte längre. I LifOS är den en betraktelse över årets krafter.'],
 haab:['Mayas solår, haab’, har 18 månader på 20 dagar och fem namnlösa dagar, wayeb’. Det går bredvid den heliga cykeln på 260 dagar, tzolk’in, och tillsammans bildar de kalenderrundan på 52 år.','Haab’ är i dag främst historiskt, men tzolk’in hålls fortfarande av k’iche’-mayas dagvaktare, ajq’ij, som läser dagens tecken inför ceremonier och vid födslar.'],
 temp:['Den hippokratiska och galenska läran knyter årets tider till de fyra kroppsvätskorna och temperamenten: våren till blodet och det sangviniska, sommaren till den gula gallan och det koleriska, hösten till den svarta gallan och det melankoliska, och vintern till slemmet och det flegmatiska.','Hippokrates Om levnadssättet ger rådet att motverka årstiden: på vintern ät mer och drick mindre, bröd och stekt kött. På sommaren ät mindre och drick mer, mjukt bröd, kokt kött och grönsaker.'],
 kab:['Sefer Yetzirah, kabbalans äldsta bok, ger varje månad en hebreisk bokstav, ett stjärntecken och en förmåga: talet i nisan, tanken i ijar och vidare till skrattet i adar. De hebreiska månaderna följer månen, så kopplingen till tecknen är ungefärlig.','I chassidisk tradition, bland annat i Bnei Yissaschar, är varje månad en tid att rena och helga sin förmåga: talet i nisan, då påskens berättelse berättas, och handlingen i elul, botgöringens månad.'],

const DRINFO_EN={
 delar:['Your tasks spread over morning, day and evening, with how many you have done in each part. The night is for rest.','Do what belongs to the part you are in. When a part is full it is done, and the next one takes over.'],
 kropp:['Chronobiology, the body’s inner clock: cortisol rises at dawn, alertness and body temperature peak in the afternoon, and melatonin rises as the light dims in the evening. The times are averages for someone who sleeps roughly 22.30–06.30.','Take daylight early, put thinking work in the morning and strength in the afternoon, and give the evening darkness and coolness before sleep.'],
 dosha:['The clock of Ayurveda: the day passes twice through the three doshas. Kapha, earth and water, rules about 6–10 and 18–22. Pitta, fire and water, rules 10–14 and 22–02. Vata, air and ether, rules 14–18 and 02–06.','Move during the morning kapha against its heaviness, eat the main meal at midday when pitta’s fire is strong, and create or meditate during vata. Sleep before ten, before the night’s pitta takes over.'],
 tibet:['Tibetan medicine, Sowa Rigpa, rests on three forces from the medical classic Rgyud bzhi. rLung, the wind, governs breath, movement and mind. mKhris-pa, the bile, governs heat, digestion and sharpness. Bad-kan, the phlegm, governs stability, fluids and sleep. The wind is strongest at dawn and dusk, the bile at noon and midnight and the phlegm in the morning.','The medicine adapts food and habits to the forces: the wind is calmed by warmth, rest, nourishing food and quiet company, the bile by coolness and rest, and the phlegm by movement and warmth. Tibetan physicians traditionally time their medicines by the hours of the forces.'],
 organ:['Chinese medicine: qi is said to flow through the twelve meridians and linger two hours in each, so every organ has its strongest hours. The liver 1–3, the lungs 3–5, the stomach 7–9, the heart 11–13 and the kidneys 17–19.','Eat breakfast in the stomach’s hours, let the liver sleep, and notice if you often wake at the same time: the table further down shows which organ the tradition links to it. This is traditional knowledge, not diagnosis.'],
 tattva:['Svara yoga, in Rama Prasad’s translation of 1890: from sunrise the element of the breath changes every twenty-four minutes, in the order akasha (ether), vayu (air), tejas (fire), prithivi (earth) and apas (water). The whole round takes two hours.','According to the Shiva Svarodaya, earth and water suit calm and lasting tasks, fire and air forceful and moving ones, and ether only meditation. The practitioner senses the element in the breath and chooses the deed accordingly.'],
 kalach:['Kalachakra, the wheel of time, is a Tibetan tantra in which outer time is mirrored in inner time, in the breath. The day’s 21,600 breaths run in twelve shifts of 1,800, about two hours each. At each shift the breath changes side channel and nostril, and in the transition 56¼ wisdom winds pass through the central channel, 675 in a day.','The tradition uses the shifts in meditation: notice which nostril dominates, and use the transition, when the breath flows evenly through both, to sit still. The breathing practices that lead the winds into the central channel belong to the completion stage and are taught by a teacher after initiation. The ring counts the shifts from sunrise, and which side you begin on you feel for yourself.'],
 horai:['The Horai were the Greek goddesses of the hours who followed the sun god Helios across the sky. Hyginus lists them in order from first light to sunset: dawn, sunrise, music and study, exercise, bath, noon, libation, prayer, meal, evening and sunset, and Nonnus adds Arktos, the night sky.','The names are the order of the day itself: study and music in the morning, exercise and bathing before noon, and libation, prayer and meal in the afternoon.'],
 kabb:['According to the Talmud, in Avodah Zarah 3b, God divides the twelve hours of the day into four: he studies the Torah, judges the world but turns to mercy, feeds all living things and plays with Leviathan. The night has three watches, according to Berakhot 3a. The three prayers are linked to Abraham and grace, Isaac and rigour and Jacob and harmony, and at midnight the devout rise for Tikkun Chatzot.','The Talmud teaches that man should imitate God: as he is merciful, be merciful. The four parts then become a template for the day: learn, judge with mercy, give and care for others, and play. The prayers are said at their times, and the devout rise at midnight for Tikkun Chatzot.'],
 tideg:['The Liturgy of the Hours is the monastic prayer eight times a day, after the Rule of Benedict from the 6th century, and it was also kept at Vadstena. The hours follow the sun: lauds at dawn, prime at sunrise, sext at noon, vespers as the lamps are lit and compline before sleep.','Pause briefly at each hour of prayer, with a verse, a few breaths or a word of thanks. It divides the day into holy sections.'],
 muhurt:['Vedic time divides the day and the night into fifteen muhurtas each, about 48 minutes each at the equinox. Brahma muhurta, the second to last part of the night, about an hour and a half before sunrise, is held to be the clearest moment for meditation and study. Abhijit, the eighth part of the day around noon, is counted as victorious.','Place meditation and study in Brahma muhurta and important beginnings in Abhijit.'],
 eykt:['The eyktir are the Old Norse day-marks from Grágás and Snorri. The day was divided into eight by where the sun stood over the landscape, from miðnætti and ótta through dagmál and hádegi to nón and náttmál, and here the times move with the sun where you live.','Let the sun and not the clock set the pace of the day: dagmál for the first real meal, nón for the afternoon rest and náttmál for the evening meal.'],
 planet:['The planetary hours come from Babylonian and Hellenistic astrology. Day and night are each divided into twelve unequal hours, ruled by the seven planets in Chaldean order, and the planet of the day rules its first hour. That is why the weekdays are named as they are.','Choose the hour by the errand: Mercury for writing and study, Venus for art and company, Mars for training and hard tasks, Jupiter for plans and generosity, Saturn for order and endings, the Sun for being seen and leading, and the Moon for rest, home and feelings.']
};

const YRINFO_EN={
 mon:['LifOS’s own thirteen months of 28 days, after the rhythm of the moon, with a day beyond time at the solstice. Each month has an image from nature and a faculty to refine.','Let the month’s faculty be what you practise during its four weeks.'],
 ljus:['The length of the day where you live, from the shortest day at midwinter to the longest at midsummer. The ring is thick and bright when the day is long.','The body’s clock is set by light. Seek daylight early in the day, especially in the dark half of the year, when light therapy is an established help against the winter dark.'],
 sami:['The Sámi divide the year into eight seasons after the reindeer-herding year: winter, spring-winter, spring, spring-summer, summer, autumn-summer, autumn and autumn-winter. The borders vary between the siidas.','In reindeer herding the season decides the work: the spring-winter trek to the calving land, the calving, the summer calf marking, the autumn slaughter and rut, and the autumn-winter sorting and trek to the winter pasture.'],
 kelt:['The Irish fire festivals divide the year: Samhain on 1 November opens the dark half and Beltane on 1 May the light half. Between them lie Imbolc on 1 February and Lughnasadh on 1 August.','At Beltane fires were lit, and the cattle were driven between two fires for protection. At Samhain the dead were honoured and the year foretold. At Imbolc Brigid’s crosses were woven, and at Lughnasadh the first harvest was celebrated with gatherings and games.'],
 forn:['The Icelandic calendar has twelve months of 30 days and four extra nights, divided into two halves: vetr from the first day of winter in October and sumar from the first day of summer in April. Each month begins on a fixed weekday.','The turns of the half-years were feasts. At the winter nights a blót was held, in Þorri the Þorrablót is held, its first day is the husbands’ day and the first day of Góa the wives’ day, and the first day of summer is still celebrated with gifts.'],
 wx:['Chinese medicine links the times of the year to the five phases and their organs: spring to wood and the liver, summer to fire and the heart, late summer to earth and the spleen, autumn to metal and the lungs, and winter to water and the kidneys.','The Huangdi Neijing, chapter 2, advises: in spring go to rest late, rise early and walk with long strides. In summer go to rest late, rise early and do not tire of the sun. In autumn go to rest early and rise with the rooster. In winter go to rest early, rise late, wait for the sun and seek warmth.'],
 ritu:['Ayurveda divides the year into six seasons, ritu, of two months each. The sun’s northward course, from late winter to the summer heat, draws strength from the body, and the southward course, from the rains to early winter, gives it back. The doshas gather and flare up in a fixed order.','Ritucharya, the rules of the seasons: in early and late winter nourishing warm food, oil massage and exercise, when the digestive fire is strong. In spring light food against kapha, in summer cool, sweet food and plenty of fluids, in the rains light, warm food against vata, and in autumn cooling and bitter food against pitta.'],
 ich:['Chinese calendar lore links twelve of the I Ching hexagrams to the months of the year. At the winter solstice the first yang line is born, in the hexagram of Return, and then the light grows line by line to six yang in summer, when the dark begins to grow in the same way.','Read the hexagram’s image as the month’s bearing. Of the Return the I Ching says that the kings of antiquity closed the passes at the solstice: merchants and strangers did not travel, and the ruler did not visit the provinces. At the turning, one rests.'],
 sp:['The 24 solar terms are the almanac of the Chinese farming year, each about fifteen days, following the sun’s path in steps of fifteen degrees. They were inscribed on UNESCO’s list of intangible cultural heritage in 2016.','The terms guided sowing, harvest and diet. At Qingming the graves are tended, and at the winter solstice people eat dumplings or rice balls for warmth.'],
 mhj:['The medicine wheel is a teaching among many Indigenous peoples of North America. Here we follow an Anishinaabe teaching: east is yellow, spring and birth, south is red, summer and youth, west is black, autumn and adulthood, and north is white, winter and the elders.','The wheel is used to keep the balance of body, feeling, mind and spirit, and the four sacred plants are used: tobacco as offering and prayer, and cedar, sage and sweetgrass for cleansing. The ceremonies belong to the peoples themselves and are learned from their elders.'],
 gah:['Zoroastrianism celebrates six gahambars, feasts of five days each, one for each part of creation in order: the sky, the water, the earth, the plants, the animals and humankind. The dates follow the seasonal Fasli calendar.','Gahambars are celebrated together: people pray, host and share food with all, whatever their rank, in thanks for the part of creation the feast honours.'],
 azt:['The Aztec solar year, xiuhpohualli, had 18 periods of 20 days and five empty days. Each period ended with a feast for a god or force, such as Tlaloc of the rain in Atlcahualo and Huitzilopochtli of the sun in Panquetzaliztli. The dates follow Sahagún, and scholars disagree about them.','The festival calendar is historical, and its rites are no longer celebrated. In LifOS it is a contemplation of the forces of the year.'],
 haab:['The Maya solar year, haab’, has 18 months of 20 days and five nameless days, wayeb’. It runs beside the sacred cycle of 260 days, tzolk’in, and together they form the calendar round of 52 years.','Haab’ is mainly historical today, but tzolk’in is still kept by the K’iche’ Maya daykeepers, ajq’ij, who read the day’s sign before ceremonies and at births.'],
 temp:['The Hippocratic and Galenic teaching links the times of the year to the four humours and temperaments: spring to blood and the sanguine, summer to yellow bile and the choleric, autumn to black bile and the melancholic, and winter to phlegm and the phlegmatic.','Hippocrates’ Regimen in Health advises working against the season: in winter eat more and drink less, bread and roasted meat. In summer eat less and drink more, soft bread, boiled meat and vegetables.'],
 kab:['Sefer Yetzirah, the oldest book of the Kabbalah, gives each month a Hebrew letter, a sign of the zodiac and a faculty: speech in Nisan, thought in Iyar and on to laughter in Adar. The Hebrew months follow the moon, so the link to the signs is approximate.','In Hasidic tradition, among others in the Bnei Yissaschar, each month is a time to cleanse and hallow its faculty: speech in Nisan, when the Passover story is told, and action in Elul, the month of repentance.'],
 zod:['The sun’s path through the twelve signs of the zodiac, with the twelve alchemical operations the tradition links to them, from calcination in Aries to projection in Pisces. How the operations are linked to the signs differs somewhat between alchemists.','The alchemists began the great work in spring, when the sun enters Aries. The operation can also be read as inner work: to burn away, dissolve, separate and join.'],
 sinn:['Rudolf Steiner spoke of twelve senses and linked them to the zodiac: the upper senses of the I, thought, word and hearing, the middle senses of warmth, sight, taste and smell, and the lower senses of balance, movement, life and touch.','In Waldorf education the lower senses are cared for mainly in childhood and the upper ones in meeting others. Letting the month’s sense be the one you train your attention on is a LifOS suggestion.'],
 kyrk:['The church year runs from Advent through Christmas, Lent and Easter to Pentecost and Trinitytide, each with its liturgical colour. Anthroposophy celebrates four great seasonal festivals: Easter, St John’s at midsummer, Michaelmas on 29 September and Christmas.','Advent is waiting, Lent cleansing and renunciation, and Easter and Christmas joy. Steiner wrote the Calendar of the Soul so that one meditates on the week’s verse, and Michaelmas is devoted to courage and will.']
};
